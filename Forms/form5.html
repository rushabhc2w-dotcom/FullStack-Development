<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h2>Complex Form</h2>
    <form>
        <fieldset>
            <legend>
                Personal Information
            </legend>
            <label for="name">Name:</label>
            <input type="text"  name= " email" id="name" placeholder="Enter name here..">
            <br/>
            <br/>
            <label for="email">Email:</label>
            <input type="text"  name= "email" id="email" placeholder="Enter email here..">
            <br/>
            <br/>
            <label for="PhoneNumber">Phone:</label>
            <input type="tel"  name= "PhoneNumber" id="email" placeholder="Enter Phone Number here..">
            <br/>
            <br/>
            <label for="datepicker">Date of Birth</label>
            <input type="date" id="datepicker">
            <br/>
            <br/>
            <span>Gender:</span>
            <label for="radio1">Male</label>
            <input type="radio" name="radio" id="radio1">
            <br/>
            <label for="radio2">Female</label>
            <input type="radio" name="radio" id="radio2">

            <br/>
            <label for="country">Country</label>
            <select name="country" id="country">
                <option value="India">India</option>
                <option value="US">United State</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>
                Address
            </legend>
            <label for="Street">Street:</label>
            <input type="text" name="Street" id="Street">

             <label for="city">city:</label>

            <input type="text" name="State" id="State">

             <label for="zipcode">Zip-Code:</label>
            <input type="text" name="Zip-Code" id="zipcode">
           
        </fieldset>
        <fieldset>
            <legend>Other Information</legend>
            <label for="textarea1">Comments</label>
            <br/>
            <textarea name="textArea1" id="textArea1" cols="30" rows="10" placeholder="Enter text here...."></textarea>
            
            <label for="terms">I Agree to the terms of service.</label>
            <input type="checkbox" name="terms" id="terms">
        </fieldset>
        <input type="Submit" value="Submit">
    </form>
</body>
</html>
