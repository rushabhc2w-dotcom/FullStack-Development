<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
        #card{
            border: 3px solid navy;
            border-radius: 20px;
            height: 300px;
            width: 400px;
            background-color: lightblue;

            text-align: center;

            padding: 20px;
            margin: 50px auto;

        }
        #card img{
            width: 150px;
            height: 150px;

            border-radius: 50%;
            
        }
        
        #card h2{
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <div id="card">
        <img src="images/photo.jpg" alt="Student Profile">
        <h2>Rushabh Pawar</h2>
        <p>Roll Number: 38</p>
        <p>Department:E&TC</p>
    </div>
</body>
</html>
