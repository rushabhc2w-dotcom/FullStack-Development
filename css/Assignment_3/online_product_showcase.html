<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #product-box{
            width: 350px;
            height: 500px;
            border: 4px dashed green;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            background-color: bisque;
        }
        #product-box button{
            background-color: orangered;
            color: white;
            border-radius: 8px;


        }
        #product-box img{
            border-radius: 12px;

        }
    </style>
</head>
<body>
    <div id="product-box">
        <img src="images/images.jpeg" >
        <h2>IPhone 16 pro</h2>
        <p>Powered by the A18 Pro chip and built for Apple Intelligence, the Pro lineup introduces larger display sizes, Camera Control, innovative pro camera features, and a huge leap in battery life

        </p>
        <h3>₹89,900</h3>
        <button>Buy Now</button>
    </div>
</body>
</html>
