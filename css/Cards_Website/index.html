<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
          width: 100%;
          height: 100%;
          min-height: 730px;
           /* https://grabient.com/_gNVgK5gQgf89gBkgCEf2-f8Nf65f_dgAvf9A */

            background: linear-gradient(180deg, #a9caff 0.000%, #b8cbff 16.667%, #d3cbff 33.333%, #f0c8f9 50.000%, #ffc5f1 66.667%, #ffc0ec 83.333%, #ffbaec 100.000%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
          width: 360px;
          height: 570px;  
          background-color: white;
          border-radius: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 30px;
          padding: 20px;
        }
        .card img{
         height: 57%;
         border-radius: 10px;   
        }
        .card h2{
            font-weight: bold;
            font-size: 1.5rem;
        }
        .card p{
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
           <img src="images/qr.jpg" alt=""> 
           <h2>Improve your Front end skills buy developing Project</h2>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Earum quam id repudiandae asperiores dignissimos ea reprehenderit, pariatur perferendis?

            </p>
        </div>
    </div>
</body>
</html>
