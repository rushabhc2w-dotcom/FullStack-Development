<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid black;
            background-color: bisque;
            display: flex;
            flex-direction:row;
            width: 450;
            margin: 3px;
            padding: 2px;
            display: flex;
            flex-direction: row;
        }
        #box1{
            background-color: yellow;
            border: 1px solid blue;
            width: 47%;
            margin: 3px;
            padding: 2px;
        }
        #box2{
           
            background-color: aquamarine;
            border: 1px solid brown;
            width: 47%;
            margin: 3px;
            padding: 2px;
        }
        p{
            border: 1px solid red;
        }
        img{
            width: 170;
        }
        @media (max-width:640px){
            .container{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
       <div class="box" id="box1">
        <p>Text1</p>
        <p>Text2</p>
       </div>
       <div class="box" id="box2">
        <img src="images/bhagat.jpeg" height="120" >
       </div> 
    </div>
</body>
</html>
