<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <header class="header">

        <div class="header-content">
            <p>Sign up and get 20% off to your first order.</p>
            <strong>Sign Up Now</strong>
        </div>

        <img src="images/cross.svg" class="cross">

    </header>
    <main>
        <div class="search-container">

            <!-- Logo -->
            <div class="logo">
                <p>SHOP.CO</p>
            </div>


            <!-- Navigation -->
            <div class="Shop">

                <select>
                    <option>Shop</option>
                    <option>Kurtas</option>
                    <option>Jeans</option>
                    <option>Fashion</option>
                </select>

                <a href="category.html"><p>Casual</p></a>

            </div>


            <!-- Search -->
            <div class="search-bar">

                <input
                    type="text"
                    placeholder="🔍 Search for product..."
                >

            </div>


            <!-- Cart and Profile -->
            <div class="cart-section">

                <img
                    src="images/cart.png"
                    alt="Shopping Cart"
                >

                <img
                    src="images/profile.png"
                    alt="Profile"
                >

            </div>

        </div>
        <nav class="category-navigation-bar">
            <a href="#" class="nav-item">Home</a>
            <span class="nav-item active">Cart</span>
        </nav>
        <div class="cart-container">
            <h2>YOUR CART</h2>
            <div class="your-cart-details">
                <div class="left-cart-product">
                    <div class="cart-card">
                        <div class="card-left">
                            <img src="images/like_img1.svg" alt="">
                        </div>
                        <div class="card-midle">
                            <span>Gradient graphic T-shirt</span>
                            <p><strong>Size:</strong>Large</p>
                            <p><strong>Size:</strong>Large</p>
                            <div class="product-price">
                                <span>$145</span>
                            </div>
                        </div>
                        <div class="card-left">
                            <img src="images/dustbin.svg" alt="">
                        </div>
                        <div class="product-quantity">
                            <button class="quantity-btn">−</button>
                            <span class="quantity-number">1</span>
                            <button class="quantity-btn">+</button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
